<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="Inter,Arial,Helvetica,sans-serif" role="img" aria-label="Ba bước từ mã QR đến voucher"><rect width="1200" height="900" fill="#F8FAFC"/><rect width="1200" height="12" fill="#10B981"/><text x="60" y="130" font-size="46" font-weight="800" fill="#0F172A">Ba bước từ mã QR đến voucher</text><text x="60" y="185" font-size="26" fill="#475569">Luồng nhận đặc quyền trên điện thoại của mẹ bầu</text><rect x="60" y="330" width="320" height="260" rx="30" fill="#fff" stroke="#CBD5E1" stroke-width="3"/><circle cx="110" cy="385" r="26" fill="#10B981"/><text x="110" y="394" text-anchor="middle" font-size="26" font-weight="800" fill="#04130D">1</text><text x="96" y="470" font-size="30" font-weight="800" fill="#0F172A">Quét QR và</text><text x="96" y="512" font-size="30" font-weight="800" fill="#0F172A">đăng ký tài khoản</text><path d="M388 460 L424 460" stroke="#0D9488" stroke-width="5" stroke-linecap="round"/><path d="M414 448 L426 460 L414 472" fill="none" stroke="#0D9488" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="440" y="330" width="320" height="260" rx="30" fill="#fff" stroke="#CBD5E1" stroke-width="3"/><circle cx="490" cy="385" r="26" fill="#10B981"/><text x="490" y="394" text-anchor="middle" font-size="26" font-weight="800" fill="#04130D">2</text><text x="476" y="470" font-size="30" font-weight="800" fill="#0F172A">Xác thực bằng</text><text x="476" y="512" font-size="30" font-weight="800" fill="#0F172A">mã labcode</text><path d="M768 460 L804 460" stroke="#0D9488" stroke-width="5" stroke-linecap="round"/><path d="M794 448 L806 460 L794 472" fill="none" stroke="#0D9488" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="820" y="330" width="320" height="260" rx="30" fill="#10B981" stroke="#10B981" stroke-width="3"/><circle cx="870" cy="385" r="26" fill="#04130D"/><text x="870" y="394" text-anchor="middle" font-size="26" font-weight="800" fill="#10B981">3</text><text x="856" y="470" font-size="30" font-weight="800" fill="#04130D">Chọn thương hiệu</text><text x="856" y="512" font-size="30" font-weight="800" fill="#04130D">nhận voucher</text><text x="60" y="700" font-size="24" fill="#475569">Mã labcode của lần xét nghiệm là điều kiện để kích hoạt tài khoản.</text><text x="60" y="740" font-size="24" fill="#475569">Mỗi mẹ bầu chọn các nhãn hàng mình yêu thích trong mạng lưới 16 thương hiệu.</text></svg>