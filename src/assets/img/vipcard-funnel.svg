<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="Inter,Arial,Helvetica,sans-serif" role="img" aria-label="Phễu VIP Card"><rect width="1200" height="900" fill="#fff"/><text x="60" y="110" font-size="44" font-weight="800" fill="#0F172A">Phễu VIP Card</text><text x="60" y="160" font-size="24" fill="#475569">Từ tham gia đến đổi voucher, số mẹ bầu theo từng tầng</text><text x="60" y="300" font-size="26" fill="#0F172A">Mẹ bầu tham gia VIP Card</text><rect x="60" y="320" width="760" height="64" rx="14" fill="#CBD5E1"/><text x="838" y="364" font-size="34" font-weight="800" fill="#047857">158.377</text><text x="60" y="470" font-size="26" fill="#0F172A">Mẹ bầu kích hoạt tài khoản</text><rect x="60" y="490" width="144" height="64" rx="14" fill="#5EEAD4"/><text x="222" y="534" font-size="34" font-weight="800" fill="#047857">29.998</text><text x="60" y="640" font-size="26" fill="#0F172A">Mẹ bầu đã đổi voucher</text><rect x="60" y="660" width="50" height="64" rx="14" fill="#10B981"/><text x="128" y="704" font-size="34" font-weight="800" fill="#047857">10.508</text><text x="60" y="840" font-size="24" fill="#475569">24.212 voucher được claim, trung bình khoảng 2,3 voucher cho mỗi mẹ bầu đổi quà.</text></svg>